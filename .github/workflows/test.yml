name: test

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # The numerical core needs numpy only, so it is cheap to test everywhere.
  core:
    name: core / py${{ matrix.python }} / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python: ['3.9', '3.12']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install --upgrade pip
      - run: pip install numpy pytest h5py
      - name: install without the MintPy dependency
        run: pip install --no-deps -e .
      - name: run the core tests
        run: pytest tests/test_swath.py -v

  # The plain install: no MintPy - viewinsar reads the files and draws the map
  # itself. rasterio for the GeoTIFF tests.
  lean:
    name: lean (no MintPy) / py${{ matrix.python }} / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        python: ['3.9', '3.12']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install --upgrade pip
      - name: install viewinsar and its few dependencies
        run: pip install -e ".[test,raster]"
      - name: run the whole suite, without MintPy
        env:
          MPLBACKEND: Agg
        run: pytest tests/ -v

  # With MintPy, the map is view.py's; conda-forge is the reliable source.
  full:
    name: full / py${{ matrix.python }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ['3.10', '3.12']
    defaults:
      run:
        shell: bash -el {0}
    steps:
      - uses: actions/checkout@v4
      - uses: conda-incubator/setup-miniconda@v3
        with:
          miniforge-version: latest
          python-version: ${{ matrix.python }}
          channels: conda-forge
          auto-activate-base: false
          activate-environment: viewinsar-ci
      - name: install mintpy
        run: conda install -y mintpy pytest pip
      - name: install viewinsar
        run: pip install --no-deps -e .
      - name: run the whole suite
        env:
          MPLBACKEND: Agg
        run: pytest tests/ -v

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install ruff
      - run: ruff check src tests

  build:
    name: build the distributions
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install build twine
      - run: python -m build
      - run: twine check dist/*
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/*
