[build-system]
requires = ["setuptools>=64", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "viewinsar"
dynamic = ["version"]
description = "Interactive swath (buffered) profiles, fault block statistics, slip-rate models and time series of InSAR velocity and time-series products (MintPy, LiCSBAS)"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "GPL-3.0-or-later" }
authors = [
    { name = "Donny Wahyudi", email = "wahyudi.donny@gmail.com" },
]
maintainers = [
    { name = "Donny Wahyudi", email = "wahyudi.donny@gmail.com" },
]
keywords = [
    "InSAR", "swath profile", "transect", "linear referencing", "MintPy",
    "fault", "violin plot", "block statistics", "LiCSBAS", "time series viewer",
    "velocity", "time-series", "deformation", "tectonics", "geodesy", "GNSS",
    "slip rate", "locking depth", "MCMC", "elastic dislocation",
    "remote-sensing",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: GNU General Public License v3 or later (GPLv3+)",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering",
    "Topic :: Scientific/Engineering :: GIS",
    "Topic :: Scientific/Engineering :: Visualization",
]
dependencies = [
    # only what viewinsar itself imports - MintPy is optional (see below)
    "numpy>=1.20",
    "scipy>=1.5",       # the slip-rate model, radar lookups, smoothing
    "matplotlib>=3.5",  # every window and figure
    "h5py>=3.0",        # MintPy / LiCSBAS HDF5 products, the downloaded DEM
    "pyproj>=3.0",      # coordinate systems: UTM data, fault traces, DEMs, GNSS
    "pyshp>=2.1",       # shapefiles (faults, GNSS, lines); pure python
    "pillow>=8.0",      # the Terrain Tiles (PNG); comes with matplotlib anyway
]

[project.optional-dependencies]
# MintPy: the map comes from view.py itself (every view.py option), the swath
# --timeseries window from tsview.py, and MintPy reads every format it knows.
# Without it viewinsar reads MintPy HDF5, GeoTIFF (with rasterio) and ROI_PAC
# .dem/.rsc itself and draws the map with the common view.py options.
mintpy = ["mintpy>=1.5"]
# GeoTIFF and every other GDAL raster (DEMs, LiCSBAS .tif), without MintPy
raster = ["rasterio>=1.2"]
# --fault, -gnss and --line-file read .shp .geojson .gpkg .kml/.kmz and GMT
# text on their own; pyogrio adds every other vector format GDAL knows
vector = ["pyogrio>=0.7"]
all = ["mintpy>=1.5", "rasterio>=1.2", "pyogrio>=0.7"]
test = ["pytest>=7.0"]
dev = ["pytest>=7.0", "ruff>=0.4", "build>=1.0", "twine>=5.0"]

[project.urls]
Homepage = "https://github.com/drwahyudi/viewinsar"
Repository = "https://github.com/drwahyudi/viewinsar"
Issues = "https://github.com/drwahyudi/viewinsar/issues"

[project.scripts]
viewinsar = "viewinsar.cli:main"

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.dynamic]
version = { attr = "viewinsar.__version__" }

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra -q"

[tool.ruff]
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "B", "I", "UP"]
ignore = [
    "E501",    # long lines are handled by line-length
    "N801",    # swathProfileViewer follows the MintPy class naming
    "BLE001",  # broad excepts are deliberate around the optional panels
]

[tool.ruff.lint.isort]
known-first-party = ["viewinsar"]
known-third-party = ["mintpy", "numpy", "matplotlib", "pytest", "h5py"]
