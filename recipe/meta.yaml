{% set name = "viewinsar" %}
{% set version = "0.5.8" %}

package:
  name: {{ name|lower }}
  version: {{ version }}

source:
  # For a conda-forge submission, point at the PyPI sdist and paste the sha256
  # printed by:  openssl dgst -sha256 dist/viewinsar-{{ version }}.tar.gz
  url: https://pypi.org/packages/source/{{ name[0] }}/{{ name }}/{{ name }}-{{ version }}.tar.gz
  sha256: fe252a5636fd3acb055e152ab081dc69ceff9d4e9acf7bc9ec36a811fb0b4474
  # To build straight from a local checkout instead, comment the two lines above
  # and uncomment:
  # path: ..

build:
  noarch: python
  number: 0
  script: {{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation
  entry_points:
    - viewinsar = viewinsar.cli:main

requirements:
  host:
    - python >=3.9
    - pip
    - setuptools >=64
    - wheel
  run:
    - python >=3.9
    - numpy >=1.20
    - scipy >=1.5
    - matplotlib-base >=3.5
    - h5py >=3.0
    - pyproj >=3.0
    - pyshp >=2.1
    - pillow >=8.0
  run_constrained:
    # optional: the full view.py map and --timeseries (mintpy), GeoTIFF without
    # MintPy (rasterio), every GDAL vector format (pyogrio)
    - mintpy >=1.5
    - rasterio >=1.2
    - pyogrio >=0.7

test:
  imports:
    - viewinsar
    - viewinsar.swath
    - viewinsar.stat
    - viewinsar.tsdata
    - viewinsar.model
    - viewinsar.gnss
    - viewinsar.licsbas
  requires:
    - pytest
  commands:
    - viewinsar --version
    - viewinsar --help
    - viewinsar swath --help
    - viewinsar stat --help
    - viewinsar tseries --help
    - viewinsar model --help
    - python -c "from viewinsar import swath_extract, swath_density, load_faults, creep_along_line, fit_profile, fit_two_lines, read_gnss"

about:
  home: https://github.com/drwahyudi/viewinsar
  summary: Interactive swath profiles, fault creep along a line, slip-rate models and time series of InSAR data (MintPy, LiCSBAS)
  description: |
    viewinsar draws a swath profile instead of a single-line transect. You pick a
    line on the map with two clicks; the line is buffered by a given half width
    (flat caps), every valid pixel inside the corridor is linearly referenced onto
    the line - the equivalent of QGIS LRS / ArcGIS "Locate Features Along Routes" -
    and the resulting cloud is shown as a log-scaled 2-D pixel-density profile with
    the density-weighted median and quartiles. The map panel comes from MintPy's
    view.py when MintPy is installed (it is optional), else from a light map of
    its own; the interaction from plot_transection.py, and an optional third
    panel with the point displacement time series from tsview.py. The located points and
    the per-bin statistics can be exported to .csv. Several sections (A-A', B-B'
    ...) can be drawn, each in its own window, with an optional elevation panel
    from a DEM and fault traces from any vector file marked where they cross.
    `viewinsar stat` measures fault creep along a line drawn on a fault, as
    Hussain et al. (2016): short profiles across it every few km, a straight
    line through each side and their offset at the fault, with a bootstrap -
    per track, and split into fault-parallel and vertical. `viewinsar
    tseries` is LiCSBAS_plot_ts.py for LiCSBAS and MintPy time series, with the
    median and quartiles of a circle of pixels at every date. `viewinsar model`
    fits the slip rate and locking depth of an elastic dislocation (and shallow
    creep) to profiles across a fault by ensemble MCMC, with GNSS. Several
    frames or tracks, and GNSS velocities, go into one swath; several profiles
    can be given up front.
  license: GPL-3.0-or-later
  license_family: GPL3
  license_file: ../LICENSE
  doc_url: https://github.com/drwahyudi/viewinsar#readme
  dev_url: https://github.com/drwahyudi/viewinsar

extra:
  recipe-maintainers:
    - drwahyudi
